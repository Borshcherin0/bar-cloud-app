<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Турнирная сетка</title>
    <style>
        :root { --bg:#0a0a14; --card:rgba(20,20,35,0.9); --text:#fff; --muted:rgba(255,255,255,0.5); --gold:#ffb800; --green:#30d158; --border:rgba(255,255,255,0.08); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:60px 20px 20px; }
        .back-btn { position:fixed; top:16px; left:16px; padding:10px 20px; background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:10px; cursor:pointer; font-size:0.85em; }
        h1 { text-align:center; font-size:1.8em; margin-bottom:30px; color:var(--gold); }
        .bracket-section { margin-bottom:30px; }
        .bracket-section h3 { text-align:center; margin-bottom:8px; }
        .bracket-container { display:flex; gap:20px; overflow-x:auto; padding:20px; justify-content:center; }
        .round { display:flex; flex-direction:column; gap:16px; justify-content:space-around; min-width:200px; }
        .round-title { text-align:center; font-size:0.7em; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-bottom:4px; }
        .match { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:8px; min-width:180px; }
        .player-row { display:flex; align-items:center; gap:4px; padding:3px 0; }
        .player-row input { flex:1; background:transparent; border:1px solid transparent; color:var(--text); padding:3px 4px; border-radius:4px; font-size:0.8em; min-width:0; }
        .player-row input:focus { border-color:var(--border); outline:none; }
        .player-row input.winner { color:var(--gold); font-weight:700; }
        .score-input { width:32px; text-align:center; background:transparent; border:1px solid transparent; color:var(--text); padding:2px; border-radius:4px; font-size:0.8em; }
        .score-input:focus { border-color:var(--border); outline:none; }
        .btn-save { display:block; width:100%; margin-top:3px; padding:3px; background:var(--green); color:#000; border:none; border-radius:4px; font-size:0.6em; cursor:pointer; font-weight:600; }
        .groups-section { margin-bottom:30px; }
        .group-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin:0 8px 10px; display:inline-block; min-width:220px; vertical-align:top; }
        .group-card h4 { font-size:0.9em; margin-bottom:6px; }
        .group-card table { width:100%; font-size:0.75em; }
        .group-card th { color:var(--muted); text-align:left; padding:1px 3px; }
        .group-card td { padding:1px 3px; }
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.location.href='/'">← Назад</button>
    <h1 id="title"></h1>
    <div id="groups"></div>
    <div id="brackets"></div>

    <script>
        var API = window.location.origin;
        var tid = new URLSearchParams(window.location.search).get('id');
        var t = null;

        async function load() {
            var r = await fetch(API+'/api/tournaments/v2/'+tid);
            t = await r.json();
            document.getElementById('title').textContent = '🏆 '+t.title;
            renderGroups();
            renderBrackets();
        }

        function renderGroups() {
            var gm = t.matches.filter(function(m){return m.bracket==='groups';});
            if (!gm.length) { document.getElementById('groups').innerHTML=''; return; }
            var groups = {};
            gm.forEach(function(m){ if(!groups[m.group_name])groups[m.group_name]=[]; groups[m.group_name].push(m); });
            var pmap = {}; t.participants.forEach(function(p){pmap[p.id]=p;});
            var html = '<div class="groups-section"><h2>Групповая стадия</h2>';
            for (var g in groups) {
                var scores = {};
                groups[g].forEach(function(m){
                    scores[m.player1_id]=scores[m.player1_id]||{w:0,l:0};
                    scores[m.player2_id]=scores[m.player2_id]||{w:0,l:0};
                    if(m.winner_id===m.player1_id){scores[m.player1_id].w++;scores[m.player2_id].l++;}
                    else if(m.winner_id===m.player2_id){scores[m.player2_id].w++;scores[m.player1_id].l++;}
                });
                var srt = Object.keys(scores).sort(function(a,b){return scores[b].w-scores[a].w;});
                html += '<div class="group-card"><h4>Группа '+g+'</h4><table><tr><th>#</th><th>Игрок</th><th>W</th></tr>';
                srt.forEach(function(pid,i){ html += '<tr><td>'+(i+1)+'</td><td>'+esc(pmap[pid]?pmap[pid].name:'?')+'</td><td>'+scores[pid].w+'</td></tr>'; });
                html += '</table></div>';
            }
            html += '</div>';
            document.getElementById('groups').innerHTML = html;
        }

        function renderBrackets() {
            var html = '';
            ['winners','losers','grand_finals'].forEach(function(bracket) {
                var pm = t.matches.filter(function(m){return m.bracket===bracket;}).sort(function(a,b){return a.round-b.round||a.match_number-b.match_number;});
                if (!pm.length) return;
                var rounds = {};
                pm.forEach(function(m){if(!rounds[m.round])rounds[m.round]=[];rounds[m.round].push(m);});
                var sorted = Object.keys(rounds).sort(function(a,b){return a-b;});
                var names = {0:'Финал',1:'Финал',2:'1/2',3:'1/4',4:'1/8'};
                html += '<div class="bracket-section"><h3>'+(bracket==='winners'?'🏆 Winners':bracket==='losers'?'🔄 Losers':'👑 Grand Finals')+'</h3><div class="bracket-container">';
                sorted.forEach(function(r){
                    html += '<div class="round"><div class="round-title">'+(names[sorted.length-parseInt(r)]||'Раунд')+'</div>';
                    rounds[r].forEach(function(m){ html += renderMatch(m); });
                    html += '</div>';
                });
                html += '</div></div>';
            });
            document.getElementById('brackets').innerHTML = html;
        }

        function renderMatch(m) {
            var pmap = {}; t.participants.forEach(function(p){pmap[p.id]=p;});
            var p1=pmap[m.player1_id], p2=pmap[m.player2_id];
            var w1=m.winner_id===m.player1_id, w2=m.winner_id===m.player2_id;
            var h = '<div class="match">';
            h += '<div class="player-row"><input type="text" class="player-name '+(w1?'winner':'')+'" value="'+esc(p1?p1.name:'')+'" data-p="1" data-m="'+m.id+'"><input type="number" class="score-input" value="'+(m.player1_score||0)+'" data-p="1" data-m="'+m.id+'"></div>';
            if(m.status==='pending') h += '<div style="text-align:center;color:var(--muted);font-size:0.55em;">vs</div>';
            h += '<div class="player-row"><input type="text" class="player-name '+(w2?'winner':'')+'" value="'+esc(p2?p2.name:'')+'" data-p="2" data-m="'+m.id+'"><input type="number" class="score-input" value="'+(m.player2_score||0)+'" data-p="2" data-m="'+m.id+'"></div>';
            h += '<button class="btn-save" onclick="save(\''+m.id+'\')">💾</button></div>';
            return h;
        }

        async function save(mid) {
            var el = document.querySelector('[data-m="'+mid+'"]');
            var n1 = el.parentElement.querySelector('[data-p="1"].player-name').value.trim();
            var s1 = parseInt(el.parentElement.querySelector('[data-p="1"].score-input').value)||0;
            var n2 = el.parentElement.querySelector('[data-p="2"].player-name').value.trim();
            var s2 = parseInt(el.parentElement.querySelector('[data-p="2"].score-input').value)||0;
            var body = {player1_name:n1, player2_name:n2, player1_score:s1, player2_score:s2};
            if (s1>s2) body.winner_name=n1;
            if (s2>s1) body.winner_name=n2;
            if (s1!==s2) body.status='finished';
            await fetch(API+'/api/tournaments/v2/matches/'+mid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
            load();
        }

        function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
        load();
    </script>
</body>
</html>
