<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Турнирная сетка</title>
    <style>
        :root {
            --bg: #0a0a14; --card: rgba(20,20,35,0.9); --text: #fff;
            --muted: rgba(255,255,255,0.5); --gold: #ffb800; --pink: #ff2d75;
            --green: #30d158; --border: rgba(255,255,255,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 60px 20px 20px; }
        .back-btn { position: fixed; top: 16px; left: 16px; z-index: 10; padding: 10px 20px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 10px; cursor: pointer; font-size: 0.85em; }
        h1 { text-align: center; font-size: 1.8em; margin-bottom: 30px; color: var(--gold); }

        .bracket-wrapper { margin-bottom: 30px; }
        .bracket-wrapper h3 { text-align: center; margin-bottom: 8px; font-size: 1.2em; }
        .bracket-container { display: flex; gap: 0; overflow-x: auto; padding: 20px 40px; min-height: 30vh; align-items: stretch; justify-content: center; }
        .round { display: flex; flex-direction: column; gap: 20px; justify-content: space-around; min-width: 200px; position: relative; }
        .round-title { text-align: center; font-size: 0.75em; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
        .match { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; min-width: 180px; position: relative; }
        .match.live { border-color: var(--green); }
        .match.finished { opacity: 0.6; }

        .player-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
        .player-row input { flex: 1; background: transparent; border: 1px solid transparent; color: var(--text); padding: 4px 6px; border-radius: 4px; font-size: 0.8em; font-family: inherit; min-width: 0; }
        .player-row input:focus { border-color: var(--border); background: rgba(255,255,255,0.03); outline: none; }
        .player-row input.winner { color: var(--gold); font-weight: 700; }
        .player-row input.loser { opacity: 0.35; }
        .score-input { width: 36px; text-align: center; background: transparent; border: 1px solid transparent; color: var(--text); padding: 2px; border-radius: 4px; font-size: 0.8em; font-family: inherit; }
        .score-input:focus { border-color: var(--border); background: rgba(255,255,255,0.03); outline: none; }
        .vs-text { text-align: center; color: var(--muted); font-size: 0.6em; padding: 2px 0; }

        .btn-save { display: block; width: 100%; margin-top: 4px; padding: 4px; background: var(--green); color: #000; border: none; border-radius: 6px; font-size: 0.65em; cursor: pointer; font-weight: 600; }
        .btn-save:hover { opacity: 0.8; }

        /* Коннекторы между раундами */
        .connectors { position: relative; min-width: 40px; }
        .connectors svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .connectors svg line { stroke: rgba(255,255,255,0.12); stroke-width: 1.5; }

        .groups-section { margin-bottom: 40px; }
        .group-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; display: inline-block; min-width: 250px; margin-right: 16px; vertical-align: top; }
        .group-card h3 { font-size: 1em; margin-bottom: 8px; text-align: left; }
        .group-card table { width: 100%; font-size: 0.8em; }
        .group-card th { color: var(--muted); font-weight: 500; text-align: left; padding: 2px 4px; }
        .group-card td { padding: 2px 4px; }
        .btn-generate { display: block; margin: 16px auto; padding: 12px 30px; background: var(--pink); color: #fff; border: none; border-radius: 10px; font-size: 0.95em; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.location.href='/'">← Назад</button>
    <h1 id="bracketTitle">Турнирная сетка</h1>
    <div id="groupsContainer"></div>
    <div id="bracketContainer"></div>

    <script>
        var API = window.location.origin;
        var tid = new URLSearchParams(window.location.search).get('id');
        var t = null;

        async function load() {
            var r = await fetch(API + '/api/tournaments/' + tid);
            t = await r.json();
            document.getElementById('bracketTitle').textContent = '🏆 ' + t.title;
            renderGroups();
            renderBracket();
        }

        function renderGroups() {
            var pmap = {};
            (t.participants||[]).forEach(function(p){pmap[p.id]=p;});
            var gm = (t.matches||[]).filter(function(m){return m.bracket_position&&m.bracket_position.startsWith('group_');});
            if (!gm.length) { document.getElementById('groupsContainer').innerHTML=''; return; }
            var groups = {};
            gm.forEach(function(m){ var g=m.bracket_position; if(!groups[g])groups[g]=[]; groups[g].push(m); });
            var html = '<div class="groups-section"><h2>Групповая стадия</h2>';
            for (var g in groups) {
                var scores = {};
                groups[g].forEach(function(m){
                    scores[m.player1_id]=scores[m.player1_id]||{w:0,l:0};
                    scores[m.player2_id]=scores[m.player2_id]||{w:0,l:0};
                    if(m.winner_id===m.player1_id){scores[m.player1_id].w++;scores[m.player2_id].l++;}
                    else if(m.winner_id===m.player2_id){scores[m.player2_id].w++;scores[m.player1_id].l++;}
                });
                var srt = Object.keys(scores).sort(function(a,b){return scores[b].w-scores[a].w||scores[a].l-scores[b].l;});
                html += '<div class="group-card"><h3>Группа '+g.replace('group_','')+'</h3><table>';
                html += '<tr><th>#</th><th>Игрок</th><th>W</th><th>L</th></tr>';
                srt.forEach(function(pid,i){ html += '<tr><td>'+(i+1)+'</td><td>'+esc(pmap[pid]?pmap[pid].name:'?')+'</td><td>'+scores[pid].w+'</td><td>'+scores[pid].l+'</td></tr>'; });
                html += '</table><div style="margin-top:8px;font-size:0.8em;">';
                groups[g].forEach(function(m){
                    var p1=pmap[m.player1_id], p2=pmap[m.player2_id];
                    var w1=m.winner_id===m.player1_id, w2=m.winner_id===m.player2_id;
                    html += '<div style="padding:4px 0;border-top:1px solid rgba(255,255,255,0.05);">';
                    html += '<span style="'+(w1?'color:var(--gold);font-weight:700;':'')+'">'+esc(p1?p1.name:'?')+'</span> vs ';
                    html += '<span style="'+(w2?'color:var(--gold);font-weight:700;':'')+'">'+esc(p2?p2.name:'?')+'</span>';
                    if(t.status==='live'&&m.status!=='finished'){
                        html += ' <button class="btn-save" style="display:inline;margin:0 2px;padding:2px 6px;font-size:0.6em;" onclick="setWinner(\''+m.id+'\',\''+m.player1_id+'\')">▲</button>';
                        html += '<button class="btn-save" style="display:inline;margin:0 2px;padding:2px 6px;font-size:0.6em;" onclick="setWinner(\''+m.id+'\',\''+m.player2_id+'\')">▼</button>';
                    }
                    html += '</div>';
                });
                html += '</div></div>';
            }
            var hasPO = (t.matches||[]).some(function(m){return (m.bracket_position==='winners'||m.bracket_position==='losers')&&m.player1_id;});
            if(!hasPO && t.status==='live'){ html += '<br><button class="btn-generate" onclick="genPO()">Сгенерировать плей-офф</button>'; }
            html += '</div>';
            document.getElementById('groupsContainer').innerHTML = html;
        }

        function renderBracket() {
            var pmap = {};
            (t.participants||[]).forEach(function(p){pmap[p.id]=p;});
            var html = '';

            ['winners','losers'].forEach(function(bracket) {
                var pm = (t.matches||[]).filter(function(m){return m.bracket_position===bracket;}).sort(function(a,b){return a.round-b.round||a.match_number-b.match_number;});
                if (!pm.length) return;
                var rounds = {};
                pm.forEach(function(m){if(!rounds[m.round])rounds[m.round]=[];rounds[m.round].push(m);});
                var sorted = Object.keys(rounds).sort(function(a,b){return a-b;});
                var maxR = parseInt(sorted[sorted.length-1]);
                var totalRounds = sorted.length;

                html += '<div class="bracket-wrapper"><h3>'+(bracket==='winners'?'🏆 Winners':'🔄 Losers')+'</h3><div class="bracket-container">';

                sorted.forEach(function(r, ri) {
                    var diff = maxR - parseInt(r);
                    var name = '';
                    if (diff === 0) name = 'Финал';
                    else if (diff === 1) name = '1/2';
                    else if (diff === 2) name = '1/4';
                    else name = '1/' + Math.pow(2, diff);

                    html += '<div class="round"><div class="round-title">' + name + '</div>';
                    rounds[r].forEach(function(m) {
                        html += renderMatch(m, pmap);
                    });
                    html += '</div>';

                    // Коннектор между раундами
                    if (ri < totalRounds - 1) {
                        html += '<div class="connectors"><svg viewBox="0 0 40 200" preserveAspectRatio="none">';
                        var nextRound = rounds[sorted[ri+1]];
                        var thisCount = rounds[r].length;
                        var nextCount = nextRound.length;
                        var step = 200 / (thisCount * 2);
                        for (var i = 0; i < thisCount; i++) {
                            var y1 = step + i * step * 2;
                            var targetIdx = Math.floor(i / 2);
                            var y2 = 100 / nextCount + targetIdx * (200 / nextCount);
                            html += '<line x1="0" y1="' + y1 + '" x2="40" y2="' + y2 + '" />';
                        }
                        html += '</svg></div>';
                    }
                });

                html += '</div></div>';
            });

            // Grand Finals
            var gf = (t.matches||[]).filter(function(m){return m.bracket_position==='grand_finals';});
            if (gf.length) {
                html += '<div class="bracket-wrapper"><h3>👑 Grand Finals</h3><div class="bracket-container"><div class="round"><div class="round-title">Финал</div>';
                gf.forEach(function(m){ html += renderMatch(m, pmap); });
                html += '</div></div></div>';
            }

            document.getElementById('bracketContainer').innerHTML = html;
        }

        function renderMatch(m, pmap) {
            var p1 = pmap[m.player1_id];
            var p2 = pmap[m.player2_id];
            var w1 = m.winner_id === m.player1_id;
            var w2 = m.winner_id === m.player2_id;

            var h = '<div class="match '+(m.status==='live'?'live':m.status==='finished'?'finished':'')+'" data-match-id="'+m.id+'">';

            // Player 1
            h += '<div class="player-row">';
            h += '<input type="text" class="player-name '+(w1?'winner':(m.status==='finished'&&!w1?'loser':''))+'" value="'+esc(p1?p1.name:'')+'" placeholder="Игрок" data-player="1" data-match="'+m.id+'">';
            h += '<input type="number" class="score-input" value="'+(m.player1_score||0)+'" data-player="1" data-match="'+m.id+'">';
            h += '</div>';

            if (m.status === 'pending') h += '<div class="vs-text">vs</div>';

            // Player 2
            h += '<div class="player-row">';
            h += '<input type="text" class="player-name '+(w2?'winner':(m.status==='finished'&&!w2?'loser':''))+'" value="'+esc(p2?p2.name:'')+'" placeholder="Игрок" data-player="2" data-match="'+m.id+'">';
            h += '<input type="number" class="score-input" value="'+(m.player2_score||0)+'" data-player="2" data-match="'+m.id+'">';
            h += '</div>';

            // Save button
            h += '<button class="btn-save" onclick="saveMatch(\''+m.id+'\')">💾 Сохранить</button>';

            h += '</div>';
            return h;
        }

        async function saveMatch(mid) {
            var matchEl = document.querySelector('[data-match-id="'+mid+'"]');
            var name1 = matchEl.querySelector('[data-player="1"].player-name').value.trim();
            var score1 = parseInt(matchEl.querySelector('[data-player="1"].score-input').value) || 0;
            var name2 = matchEl.querySelector('[data-player="2"].player-name').value.trim();
            var score2 = parseInt(matchEl.querySelector('[data-player="2"].score-input').value) || 0;

            // Находим ID игроков по именам
            var pmap = {};
            (t.participants||[]).forEach(function(p){pmap[p.name]=p.id;});
            var pid1 = pmap[name1] || null;
            var pid2 = pmap[name2] || null;

            var body = { player1_score: score1, player2_score: score2 };
            if (score1 > score2) body.winner_id = pid1;
            if (score2 > score1) body.winner_id = pid2;
            if (pid1 && pid2 && score1 !== score2) body.status = 'finished';

            await fetch(API+'/api/tournaments/matches/'+mid,{
                method:'PUT',headers:{'Content-Type':'application/json'},
                body:JSON.stringify(body)
            });
            load();
        }

        async function setWinner(mid, wid) {
            await fetch(API+'/api/tournaments/matches/'+mid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({winner_id:wid,status:'finished'})});
            load();
        }

        async function genPO() {
            await fetch(API+'/api/tournaments/'+tid+'/generate-playoff',{method:'PUT'});
            load();
        }

        function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
        load();
    </script>
</body>
</html>
