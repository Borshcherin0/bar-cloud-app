<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Bar 🍸</title>
    <link rel="stylesheet" href="/static/css/menu.css">
</head>
<body>

    <!-- Неоновые линии на фоне -->
    <div class="neon-lines">
        <div class="neon-line neon-line-1"></div>
        <div class="neon-line neon-line-2"></div>
        <div class="neon-line neon-line-3"></div>
    </div>

    <!-- Hero -->
    <div class="hero">
        <div class="hero-glass">
            <div class="hero-logo">🦇</div>
            <h1 class="neon-text">Monster Bar</h1>
            <p class="hero-subtitle">Коктейли с характером</p>
        </div>
    </div>

    <!-- Навигация -->
    <div class="nav-container">
        <div class="categories-nav" id="categoriesNav"></div>
    </div>

    <!-- Меню -->
    <div class="menu-container" id="menuContainer">
        <div class="menu-loading">Загрузка меню...</div>
    </div>

    <!-- Футер -->
    <div class="footer">
        <p class="neon-text-small">🦇 Monster Bar</p>
        <p>Работаем для вас</p>
    </div>

    <script src="/static/js/menu.js"></script>
</body>
</html>
