<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню бара 🍸</title>
    <style>
        :root {
            --glass-bg: rgba(28, 28, 30, 0.45);
            --glass-bg-card: rgba(28, 28, 30, 0.55);
            --glass-bg-heavy: rgba(18, 18, 20, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-strong: rgba(255, 255, 255, 0.14);
            --glass-highlight: rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --glass-shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);
            --glass-blur: saturate(180%) blur(30px);
            --glass-blur-light: saturate(150%) blur(20px);
            --text: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-tertiary: rgba(255, 255, 255, 0.35);
            --gold: #ff9f0a;
            --accent: #ff453a;
            --green: #30d158;
            --blue: #0a84ff;
            --purple: #bf5af2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: #000000;
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Фоновые сферы */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(10, 132, 255, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(191, 90, 242, 0.08) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 159, 10, 0.06) 0%, transparent 40%);
            z-index: 0;
            pointer-events: none;
        }

        /* Hero */
        .hero {
            position: relative;
            z-index: 1;
            height: 55vh;
            min-height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero-glass {
            background: var(--glass-bg-heavy);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border-strong);
            border-radius: 32px;
            padding: 50px 60px;
            box-shadow: var(--glass-shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .hero-glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }

        .hero h1 {
            font-size: 3.5em;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .hero p {
            font-size: 1.1em;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Навигация */
        .nav-container {
            position: sticky;
            top: 16px;
            z-index: 100;
            padding: 0 20px;
            margin-bottom: 30px;
        }

        .categories-nav {
            display: flex;
            justify-content: center;
            gap: 6px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 6px;
            max-width: 600px;
            margin: 0 auto;
            flex-wrap: wrap;
            box-shadow: var(--glass-shadow);
        }

        .cat-btn {
            padding: 10px 18px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 15px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .cat-btn.active {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
        }

        .cat-btn:hover:not(.active) {
            color: var(--text);
            background: rgba(255,255,255,0.04);
        }

        /* Меню */
        .menu-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 60px;
            position: relative;
            z-index: 1;
        }

        .category-section {
            margin-bottom: 50px;
        }

        .category-title {
            font-size: 1.8em;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: -0.3px;
            color: var(--text);
        }

        .drinks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Карточка */
        .drink-card {
            background: var(--glass-bg-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
            position: relative;
            box-shadow: var(--glass-shadow);
        }

        .drink-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            z-index: 1;
        }

        .drink-card:hover {
            transform: translateY(-6px);
            border-color: var(--glass-border-strong);
            box-shadow: var(--glass-shadow-lg);
        }

        .drink-image-container {
            width: 100%;
            height: 200px;
            overflow: hidden;
            position: relative;
        }

        .drink-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .drink-card:hover .drink-image {
            transform: scale(1.05);
        }

        .drink-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            background: linear-gradient(135deg, rgba(10,132,255,0.1), rgba(191,90,242,0.1));
        }

        .drink-info {
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .drink-name {
            font-size: 1.2em;
            font-weight: 600;
            letter-spacing: -0.2px;
            margin-bottom: 6px;
        }

        .drink-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 10px;
        }

        .ingredient-tag {
            padding: 4px 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            font-size: 0.7em;
            color: var(--text-secondary);
        }

        .drink-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .drink-price {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .drink-stock {
            font-size: 0.75em;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .drink-stock.available {
            color: var(--green);
            background: rgba(48,209,88,0.1);
        }

        .drink-stock.low {
            color: var(--gold);
            background: rgba(255,159,10,0.1);
        }

        .drink-stock.out {
            color: var(--accent);
            background: rgba(255,69,58,0.1);
        }

        .out-of-stock-card {
            opacity: 0.5;
        }

        .out-of-stock-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-12deg);
            z-index: 2;
            font-size: 1.5em;
            font-weight: 800;
            color: var(--accent);
            border: 2px solid var(--accent);
            padding: 8px 24px;
            border-radius: 8px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Футер */
        .footer {
            text-align: center;
            padding: 40px;
            color: var(--text-tertiary);
            font-size: 0.85em;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 640px) {
            .hero-glass {
                padding: 30px;
                border-radius: 24px;
            }
            .hero h1 { font-size: 2.2em; }
            .drinks-grid { grid-template-columns: 1fr; }
            .cat-btn { font-size: 11px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

    <!-- Hero -->
    <div class="hero">
        <div class="hero-glass">
            <h1>Коктейльная карта</h1>
            <p>Искусство вкуса в каждом бокале</p>
        </div>
    </div>

    <!-- Навигация -->
    <div class="nav-container">
        <div class="categories-nav" id="categoriesNav"></div>
    </div>

    <!-- Меню -->
    <div class="menu-container" id="menuContainer">
        <div style="text-align:center;padding:60px;color:var(--text-secondary);">Загрузка меню...</div>
    </div>

    <!-- Футер -->
    <div class="footer">
        <p>🍸 Барный учёт Pro</p>
    </div>

    <script>
        const API_BASE = window.location.origin;

        async function loadMenu() {
            try {
                const [drinksRes, inventoryRes] = await Promise.all([
                    fetch(`${API_BASE}/api/drinks?category=positive`),
                    fetch(`${API_BASE}/api/inventory/report`).catch(() => null)
                ]);

                const drinks = await drinksRes.json();
                const inventory = inventoryRes ? await inventoryRes.json() : [];

                const stockMap = {};
                if (Array.isArray(inventory)) {
                    inventory.forEach(item => {
                        stockMap[item.drink_id] = item.max_servings;
                    });
                }

                renderMenu(drinks, stockMap);
            } catch (e) {
                console.error(e);
                document.getElementById('menuContainer').innerHTML = 
                    '<div style="text-align:center;padding:60px;color:var(--text-secondary);">Не удалось загрузить меню</div>';
            }
        }

        function renderMenu(drinks, stockMap) {
            const container = document.getElementById('menuContainer');
            const navContainer = document.getElementById('categoriesNav');

            if (!drinks.length) {
                container.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-secondary);">Меню пока пусто</div>';
                return;
            }

            const categories = {
                'alco': { name: 'Алкогольные коктейли', icon: '🍸', drinks: [] },
                'no_alco': { name: 'Безалкогольные', icon: '🥤', drinks: [] },
                'hookah': { name: 'Кальяны', icon: '💨', drinks: [] },
                'poker': { name: 'Покер', icon: '♠️', drinks: [] },
            };

            drinks.forEach(d => {
                if (d.price <= 0 || d.price_type !== 'regular') return;
                const cat = categories[d.category];
                if (cat) cat.drinks.push(d);
            });

            const activeCategories = Object.entries(categories).filter(([_, v]) => v.drinks.length > 0);

            // Навигация
            navContainer.innerHTML = activeCategories.map(([key, cat], i) => `
                <button class="cat-btn ${i === 0 ? 'active' : ''}" onclick="scrollToCat('${key}', this)">
                    ${cat.icon} ${cat.name}
                </button>
            `).join('');

            // Меню
            container.innerHTML = activeCategories.map(([key, cat]) => `
                <div class="category-section" id="cat-${key}">
                    <div class="category-title">${cat.icon} ${cat.name}</div>
                    <div class="drinks-grid">
                        ${cat.drinks.map(d => {
                            const servings = stockMap[d.id];
                            const outOfStock = servings !== undefined && servings === 0;
                            
                            let stockHtml = '';
                            if (servings !== undefined) {
                                if (servings >= 999) {
                                    stockHtml = '';
                                } else if (servings > 5) {
                                    stockHtml = `<span class="drink-stock available">${servings} порц.</span>`;
                                } else if (servings > 0) {
                                    stockHtml = `<span class="drink-stock low">${servings} порц.</span>`;
                                } else {
                                    stockHtml = `<span class="drink-stock out">Нет</span>`;
                                }
                            }

                            const imageHtml = d.image_url 
                                ? `<img src="${d.image_url}" class="drink-image" alt="${d.name}" loading="lazy">`
                                : `<div class="drink-placeholder">🍹</div>`;

                            const ingredients = d.ingredients || [];

                            return `
                                <div class="drink-card ${outOfStock ? 'out-of-stock-card' : ''}">
                                    ${outOfStock ? '<div class="out-of-stock-badge">Нет в наличии</div>' : ''}
                                    <div class="drink-image-container">${imageHtml}</div>
                                    <div class="drink-info">
                                        <div class="drink-name">${d.name}</div>
                                        ${ingredients.length ? `
                                        <div class="drink-tags">
                                            ${ingredients.slice(0, 5).map(i => 
                                                `<span class="ingredient-tag">${i.name}</span>`
                                            ).join('')}
                                        </div>` : ''}
                                        <div class="drink-footer">
                                            <div class="drink-price">${d.price} ₽</div>
                                            ${stockHtml}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        function scrollToCat(key, btn) {
            document.getElementById('cat-' + key)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        loadMenu();
    </script>
</body>
</html>
