<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Bar 🍸</title>
    <link rel="stylesheet" href="/static/css/menu.css?v=3">
    <link rel="stylesheet" href="/static/css/leaderboards.css?v=7">
</head>
<body>

    <!-- Фон с неоновыми вертикалями -->
    <div class="bg-neon-signs">
        <div class="neon-pillar"></div>
        <div class="neon-pillar"></div>
        <div class="neon-pillar"></div>
        <div class="neon-pillar"></div>
        <div class="neon-pillar"></div>
        <div class="neon-pillar"></div>
        <div class="neon-pillar"></div>
        <div class="neon-pillar"></div>
    </div>

<!-- Hero — неоновая вывеска -->
<div class="hero">
    <div class="neon-sign">
        <div class="sign-header">
            <span class="side-text left">Clown</span>
              <span class="sign-icon">🃏</span>
            <span class="side-text right">Club &</span>
        </div>
        <h1 class="sign-title">Monster Bar</h1>
    </div>
</div>

    <!-- Навигация -->
<div class="nav-container">
     <div class="categories-nav" id="categoriesNav">
    <button class="cat-btn active" data-tab="menu">🍸 Меню</button>
    <button class="cat-btn" data-tab="events">📅 События</button>
    <button class="cat-btn" data-tab="leaderboards"><span aria-hidden="true">🏆</span> Турниры</button>
</div>
</div>

    

<!-- Меню -->
<div class="tab-content active" id="tab-menu">
    <div class="menu-container" id="menuContainer">
        <div class="menu-loading">Загрузка меню...</div>
    </div>
</div>

<!-- События -->
<div class="tab-content" id="tab-events">
    <div class="menu-container proposal-section">
        <div class="proposal-toolbar">
            <button class="proposal-button proposal-button-primary" aria-controls="proposalForm" onclick="document.getElementById('proposalForm').hidden = false">Предложить событие</button>
        </div>
        <form id="proposalForm" class="proposal-card" hidden onsubmit="submitProposal(event)">
            <h2 class="category-subtitle">Предложить событие</h2>
            <label>Название<input name="title" required maxlength="200"></label>
            <label>Исходный текст<textarea name="original_text" required maxlength="4000" rows="5"></textarea></label>
            <div class="proposal-actions">
                <button class="proposal-button" type="button" onclick="styleProposal()">Оформить в стиле Monster Bar</button>
                <button class="proposal-button proposal-button-quiet" type="button" onclick="restoreProposal()">Оставить оригинал</button>
            </div>
            <label>Текст для публикации<textarea name="description" required maxlength="5000" rows="5"></textarea></label>
            <div class="proposal-schedule">
            <label>Дата<input name="event_date" type="date" required></label>
            <label>Время (Москва)<input name="event_time" type="time" required value="20:00"></label>
            </div>
            <label>Место<input name="location" required maxlength="300" value="Monster Bar"></label>
            <p class="proposal-note">Событие появится в календаре после одобрения администратором.</p>
            <div class="proposal-actions proposal-submit">
            <button class="proposal-button proposal-button-primary" type="submit">Отправить на модерацию</button>
            <button class="proposal-button proposal-button-quiet" type="button" onclick="document.getElementById('proposalForm').hidden = true">Закрыть</button>
            </div>
            <p class="proposal-status" id="proposalStatus" role="status"></p>
        </form>
    </div>
    <div class="menu-container" id="eventsContainer">
        <div class="menu-loading">Загрузка событий...</div>
    </div>
</div>


    
    <div class="tab-content" id="tab-leaderboards">
        <div class="menu-container">
            <h2 class="category-title">Турниры</h2>
            <div id="leaderboards" class="lb lb-guest"></div>
        </div>
    </div>

    <!-- Футер -->
    <div class="footer">
        <p class="neon-text-small">🦇 Monster Bar</p>
        <p>Работаем для вас</p>
    </div>

    <script src="/static/js/leaderboards.js?v=11"></script>
    <script src="/static/js/menu.js?v=5"></script>
<script src="/static/js/event-proposals.js?v=1"></script>
</body>
</html>
