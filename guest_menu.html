<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню бара 🍸</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #1a1a1a;
            --text: #ffffff;
            --muted: #999999;
            --gold: #d4a853;
            --accent: #c0392b;
            --green: #27ae60;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Playfair Display', 'Georgia', serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Параллакс-фон */
        .hero {
            height: 60vh;
            min-height: 400px;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)),
                        url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=1200');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .hero-content {
            z-index: 1;
        }

        .hero h1 {
            font-size: 4em;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #fff 0%, #d4a853 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.2em;
            color: var(--muted);
            font-style: italic;
        }

        /* Категории */
        .categories-nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 20px;
            background: rgba(26,26,26,0.9);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
        }

        .cat-btn {
            padding: 12px 24px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: var(--muted);
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            font-family: 'Montserrat', sans-serif;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        /* Меню */
        .menu-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .category-section {
            margin-bottom: 60px;
        }

        .category-title {
            font-size: 2em;
            text-align: center;
            margin-bottom: 30px;
            color: var(--gold);
            letter-spacing: 1px;
            position: relative;
        }

        .category-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background: var(--gold);
            margin: 10px auto 0;
        }

        .drinks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        /* Карточка напитка */
        .drink-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .drink-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-color: rgba(212,168,83,0.3);
        }

        .drink-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
        }

        .drink-image-placeholder {
            width: 100%;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            background: linear-gradient(135deg, #1a1a2e, #2a1a3e);
        }

        .drink-info {
            padding: 20px;
        }

        .drink-name {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .drink-description {
            font-size: 0.9em;
            color: var(--muted);
            margin-bottom: 12px;
            line-height: 1.5;
            font-family: 'Montserrat', sans-serif;
        }

        .drink-ingredients-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .ingredient-tag {
            padding: 4px 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            font-size: 0.75em;
            color: var(--muted);
            font-family: 'Montserrat', sans-serif;
        }

        .drink-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .drink-price {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--gold);
        }

        .drink-volume {
            font-size: 0.85em;
            color: var(--muted);
            font-family: 'Montserrat', sans-serif;
        }

        .out-of-stock {
            opacity: 0.5;
            position: relative;
        }

        .out-of-stock::after {
            content: 'Нет в наличии';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 2em;
            font-weight: 900;
            color: var(--accent);
            border: 3px solid var(--accent);
            padding: 10px 30px;
            border-radius: 8px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* Футер */
        .footer {
            text-align: center;
            padding: 40px;
            color: var(--muted);
            font-size: 0.9em;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5em; }
            .drinks-grid { grid-template-columns: 1fr; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Hero -->
    <div class="hero">
        <div class="hero-content">
            <h1>Коктейльная карта</h1>
            <p>Искусство вкуса в каждом бокале</p>
        </div>
    </div>

    <!-- Навигация по категориям -->
    <div class="categories-nav" id="categoriesNav"></div>

    <!-- Меню -->
    <div class="menu-container" id="menuContainer">
        <div style="text-align:center;padding:60px;color:var(--muted);">Загрузка меню...</div>
    </div>

    <!-- Футер -->
    <div class="footer">
        <p>🍸 Барный учёт Pro &copy; 2024</p>
        <p style="margin-top:8px;font-size:0.8em;">Мы используем только свежие ингредиенты</p>
    </div>

    <script>
        const API_BASE = window.location.origin;

        async function loadMenu() {
            try {
                // Загружаем напитки и остатки
                const [drinks, inventory] = await Promise.all([
                    fetch(`${API_BASE}/api/drinks?category=positive`).then(r => r.json()),
                    fetch(`${API_BASE}/api/inventory/report`).catch(() => [])
                ]);

                // Карта остатков
                const stockMap = {};
                if (Array.isArray(inventory)) {
                    inventory.forEach(item => {
                        stockMap[item.drink_id] = item.max_servings;
                    });
                }

                renderMenu(drinks, stockMap);
            } catch (e) {
                document.getElementById('menuContainer').innerHTML = 
                    '<div style="text-align:center;padding:60px;color:var(--muted);">Ошибка загрузки меню</div>';
            }
        }

        function renderMenu(drinks, stockMap) {
            const container = document.getElementById('menuContainer');
            const navContainer = document.getElementById('categoriesNav');

            if (!drinks.length) {
                container.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted);">Меню пока пусто</div>';
                return;
            }

            // Категории
            const categories = {
                'alco': { name: '🍸 Алкогольные коктейли', drinks: [], icon: '🍸' },
                'no_alco': { name: '🥤 Безалкогольные', drinks: [], icon: '🥤' },
                'hookah': { name: '💨 Кальяны', drinks: [], icon: '💨' },
                'poker': { name: '♠️ Покер', drinks: [], icon: '♠️' },
            };

            drinks.forEach(d => {
                if (d.price <= 0 || d.price_type !== 'regular') return;
                const cat = categories[d.category] || categories['alco'];
                cat.drinks.push(d);
            });

            // Фильтруем пустые категории
            const activeCategories = Object.entries(categories).filter(([k, v]) => v.drinks.length > 0);

            // Навигация
            navContainer.innerHTML = activeCategories.map(([key, cat]) => `
                <button class="cat-btn ${key === activeCategories[0][0] ? 'active' : ''}" 
                        onclick="scrollToCategory('${key}')">
                    ${cat.icon} ${cat.name.split(' ').pop()}
                </button>
            `).join('');

            // Рендер меню
            container.innerHTML = activeCategories.map(([key, cat]) => {
                const drinksHtml = cat.drinks.map(d => {
                    const servings = stockMap[d.id];
                    const outOfStock = servings !== undefined && servings === 0;

                    // Получаем ингредиенты (если есть)
                    let ingredientsHtml = '';
                    if (d.ingredients) {
                        ingredientsHtml = d.ingredients.slice(0, 4).map(i => 
                            `<span class="ingredient-tag">${i.name}</span>`
                        ).join('');
                    }

                    // Картинка или плейсхолдер
                    const imageHtml = d.image_url 
                        ? `<img src="${d.image_url}" class="drink-image" alt="${d.name}" loading="lazy">`
                        : `<div class="drink-image-placeholder">🍹</div>`;

                    return `
                        <div class="drink-card ${outOfStock ? 'out-of-stock' : ''}">
                            ${imageHtml}
                            <div class="drink-info">
                                <div class="drink-name">${d.name}</div>
                                <div class="drink-description">
                                    ${d.description || 'Освежающий коктейль из лучших ингредиентов'}
                                </div>
                                ${ingredientsHtml ? `<div class="drink-ingredients-preview">${ingredientsHtml}</div>` : ''}
                                <div class="drink-footer">
                                    <div class="drink-price">${d.price} ₽</div>
                                    ${servings !== undefined && servings > 0 && servings < 999 
                                        ? `<div class="drink-volume">Доступно: ${servings} порц.</div>` 
                                        : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="category-section" id="cat-${key}">
                        <div class="category-title">${cat.name}</div>
                        <div class="drinks-grid">${drinksHtml}</div>
                    </div>
                `;
            }).join('');
        }

        function scrollToCategory(key) {
            const el = document.getElementById('cat-' + key);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                // Обновляем активную кнопку
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                event.target.classList.add('active');
            }
        }

        // Загружаем меню при открытии
        loadMenu();
    </script>
</body>
</html>
